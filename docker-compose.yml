services:
  postgres-meta:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: snippeter
      POSTGRES_PASSWORD: snippeter
      POSTGRES_DB: snippeter_meta
    ports:
      - "15432:5432"
    volumes:
      - snippeter_meta_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snippeter -d snippeter_meta"]
      interval: 3s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: snippeter
      MINIO_ROOT_PASSWORD: snippeter_secret
    volumes:
      - snippeter_minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 5s
      retries: 5

  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "5556:5556"
    volumes:
      - ./docker/dex/config.yaml:/etc/dex/config.yaml:ro
      - snippeter_dex_data:/var/dex
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5556/dex/.well-known/openid-configuration"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  snippeter_meta_data:
  snippeter_minio_data:
  snippeter_dex_data:
